<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViceTube</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f0f0f;
  color:#fff;
  padding-top:84px;
}

header{
  position:fixed !important;
  top:12px;
  left:clamp(10px,2vw,24px);
  right:clamp(10px,2vw,24px);
  z-index:5000;

 background:rgba(32,32,32,.58) !important;

 -webkit-backdrop-filter:blur(22px) saturate(155%);
 backdrop-filter:blur(22px) saturate(155%);

 border:1px solid rgba(255,255,255,.13);
 border-top-color:rgba(255,255,255,.20);
 border-radius:18px;

 box-shadow:
  0 12px 35px rgba(0,0,0,.30),
  inset 0 1px 0 rgba(255,255,255,.10),
  inset 0 -1px 0 rgba(255,255,255,.04);

 transform:translateY(0) scale(1);

 transition:
  transform .28s cubic-bezier(.2,.8,.2,1),
  box-shadow .28s ease,
  border-color .28s ease;

isolation:isolate;

overflow:visible;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
  radial-gradient(
  circle at 18% -40%,
  rgba(255,255,255,.18),
  transparent 34%),

  linear-gradient(
  105deg,
  rgba(255,255,255,.07),
  transparent 32%,
  rgba(255,255,255,.025));

  z-index:-1;
  border-radius:inherit;
}

header::after{
 content:"";
 position:absolute;
 left:8%;
 right:8%;
 top:0;
 height:1px;

 background:linear-gradient(
 90deg,
 transparent,
 rgba(255,255,255,.32),
 transparent);

    pointer-events:none;
}

header.vt-glass-scrolled{
  background:rgba(25,25,25,.72) !important;

  border-color:rgba(255,255,255,.17);

  box-shadow:
  0 14px 38px rgba(0,0,0,.38),
  inset 0 1px 0 rgba(255,255,255,.11);

  transform:translateY(-2px) scale(.992);
}

header.vt-glass-moving{
  transform:translateY(-7px) scale(.988);
}

.header-inner{
  min-height:60px;
  display:flex;
  align-items:center;
  gap:clamp(10px,2vw,20px);
  padding:10px 14px;
  width:100%;
  box-sizing:border-box;
}

.header-inner > .account{
  margin-left:auto !important;
  margin-right:0 !important;
  flex:0 0 auto;
}


.logo{
  display:flex;
  align-items:center;
  gap:9px;

  color:#a600ff;
  text-decoration:none;
  font-size:21px;
  font-weight:700;

  white-space:nowrap;
}

.logo img{
  width:36px;
  height:36px;
  object-fit:contain;
  border-radius:9px;
}

.search{
  flex:1;
  display:flex;
  justify-content:center;
  min-width:0;
}

.search input{
  width:min(600px,100%);
  height:40px;

  padding:0 16px;

  background:rgba(255,255,255,.08);
  color:#fff;

  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;

  outline:none;

  font-size:15px;

  transition:
  border-color .2s,
  box-shadow .2s;
}

.search input:focus{
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.22);

  box-shadow:
  0 0 0 3px rgba(255,255,255,.04);
}

.search input::placeholder{
  color:#aaa;
}

.account{
  position:relative;
  flex:0 0 auto;
  margin-left:auto;
  z-index:10;
}

.avatar{
  width:42px;
  height:42px;

  border-radius:50%;

  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;
  font-size:22px;

  transition:
  transform .2s,
  box-shadow .2s;
}

.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}

.avatar:hover{
  background:rgba(255,255,255,.17);

  transform:scale(1.05);

  box-shadow:
  0 5px 20px rgba(0,0,0,.25);
}

.menu{
  position:absolute;

  top:52px;
  right:0;

  width:min(240px,calc(100vw - 24px));

  background:rgba(30,30,30,.92);

  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.12);
  border-radius:14px;

  overflow:hidden;

  display:none;

  z-index:6000;

  box-shadow:
  0 15px 40px rgba(0,0,0,.45);
}

.menu.show{
  display:block;
}

.menu button,
.menu a{
  width:100%;

  display:block;

  padding:13px 16px;

  background:transparent;
  border:0;

  color:#fff;

  text-align:left;
  text-decoration:none;

  font-size:14px;

  cursor:pointer;

  transition:background .2s;
}

.menu button:hover,
.menu a:hover{
  background:rgba(255,255,255,.09);
}

.account-name{
  padding:15px 16px;

  font-weight:bold;

  border-bottom:1px solid rgba(255,255,255,.08);
}

main{
  padding:20px clamp(12px,3vw,35px);
}

h1{
  font-size:26px;
  margin:10px 0 22px;
}

.video-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fill,minmax(250px,1fr));

  gap:24px 16px;
}

.video-card{
  background:#181818;
  border-radius:12px;

  overflow:hidden;

  cursor:pointer;

  transition:
  transform .2s,
}

.video-card:hover{
  transform:translateY(-3px);
  background:#202020;
}

.thumbnail{
  width:100%;
  aspect-ratio:16 / 9;

  background:#222;

  object-fit:cover;

  display:block;
}

.video-info{
  padding:11px 12px 14px;
}

.video-title{
  font-size:15px;
  font-weight:600;
  line-height:1.35;

  margin-bottom:7px;
}

.video-channel{color:#aaa;font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.video-channel:hover{color:var(--accent,#a600ff)}
.video-meta{
  color:#aaa;
  font-size:13px;
}



.site-footer{
  position:fixed;
  left:14px;
  bottom:14px;
  width:178px;
  padding:12px 10px;
  box-sizing:border-box;
  z-index:4100;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;
  -webkit-backdrop-filter:blur(18px) saturate(135%);
  backdrop-filter:blur(18px) saturate(135%);
  box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.08);
}
.site-footer-links{
  display:flex;
  flex-wrap:wrap;
  gap:5px 10px;
}
.site-footer a{
  color:#999;
  text-decoration:none;
  font-size:11px;
  transition:color .15s ease;
}
.site-footer a:hover{color:#ddd}
.site-footer-copy{
  margin-top:7px;
  color:#666;
  font-size:10px;
}

/* Боковое меню категорий */
.category-sidebar{
  position:fixed;
  left:14px;
  transform:translateX(5%);
  top:108px;
  width:178px;
  padding:10px;
  z-index:4200;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.16);
  border-top-color:rgba(255,255,255,.25);
  border-radius:18px;
  -webkit-backdrop-filter:blur(22px) saturate(145%);
  backdrop-filter:blur(22px) saturate(145%);
  box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);
}
.category-sidebar::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.10),transparent 38%,rgba(255,255,255,.025));
}
.category-title{
  position:relative;
  padding:8px 10px 10px;
  color:#aaa;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.category-btn{
  position:relative;
  width:100%;
  margin:3px 0;
  padding:10px 11px;
  border:1px solid rgba(255,255,255,.16) !important;
  border-top-color:rgba(255,255,255,.25) !important;
  border-radius:12px;
  background:rgba(255,255,255,.075) !important;
  color:#e0e0e0 !important;
  box-shadow:0 5px 18px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.10) !important;
  -webkit-backdrop-filter:blur(14px) saturate(135%);
  backdrop-filter:blur(14px) saturate(135%);
  text-align:left;
  font-size:14px;
  cursor:pointer;
  transition:none !important;
}
.category-btn:hover{
  background:rgba(255,255,255,.075) !important;
  border-color:rgba(255,255,255,.16) !important;
  color:#e0e0e0 !important;
  box-shadow:0 5px 18px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.10) !important;
}
.category-btn:not(.active),
.category-btn:not(.active):hover,
.category-btn:not(.active):focus,
.category-btn:not(.active):focus-visible,
.category-btn:not(.active):active{
  background:rgba(255,255,255,.075) !important;
  border-color:rgba(255,255,255,.16) !important;
  color:#e0e0e0 !important;
  box-shadow:0 5px 18px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.10) !important;
  outline:none !important;
}

.category-btn.active,
.category-btn.active:hover,
.category-btn.active:focus,
.category-btn.active:focus-visible{
  background:var(--accent, #a600ff) !important;
  border-color:var(--accent, #a600ff) !important;
  color:#fff !important;
}
.subscriptions-section{
  position:relative;
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid rgba(255,255,255,.12);
}
.subscriptions-title{
  padding:6px 10px 8px;
  color:#aaa;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.subscriptions-list{
  display:flex;
  flex-direction:column;
  gap:4px;
  max-height:calc(100vh - 390px);
  overflow-y:auto;
  scrollbar-width:thin;
}
.subscription-channel{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
  padding:7px 9px;
  border:1px solid transparent;
  border-radius:11px;
  color:#e0e0e0;
  text-decoration:none;
  font-size:13px;
  transition:background .15s ease,border-color .15s ease;
}
.subscription-channel:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.12);
}
.subscription-channel img{
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}
.subscription-channel span{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.subscriptions-empty{
  padding:6px 10px 4px;
  color:#777;
  font-size:12px;
  line-height:1.4;
}
main{margin-left:205px;}

@media(max-width:900px){
  .category-sidebar{left:10px;width:150px;}
  main{margin-left:175px;}
}

@media(max-width:600px){

.site-footer{
  position:static;
  width:auto;
  margin:16px 8px 20px;
  padding:10px 12px;
}
.site-footer-links{justify-content:center;}
.site-footer-copy{text-align:center;}

.category-sidebar{
  transform:none;
  left:8px;
  right:8px;
  top:145px;
  width:auto;
  padding:7px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}
.category-sidebar::-webkit-scrollbar{display:none;}
.category-title{display:none;}
.category-btn{width:auto;flex:0 0 auto;margin:0;padding:8px 10px;white-space:nowrap;font-size:12px;}
main{margin-left:0;padding-top:92px;}

header{
  top:8px;
  left:8px;
  right:8px;
  border-radius:16px;}

body{
  padding-top:136px;}

.header-inner{
  flex-wrap:wrap;
  position:relative;}

.account{
  position:absolute;
  top:10px;
  right:14px;
}

.logo{
  font-size:18px;
  padding-right:52px;}

.logo img{
  width:32px;
  height:32px;}

.search{
  order:3;
  flex-basis:100%;}

.search input{
  width:100%;}

.video-grid{
  grid-template-columns:
  repeat(auto-fill,minmax(180px,1fr));
  gap:16px 10px;}
}

@media(max-width:400px){

body{
  padding-top:136px;}

.video-grid{
  grid-template-columns:1fr;}
}

/* View page buttons use the same background as the search menu */
.watch-page button,
.watch-page .btn,
.watch-page .button,
.watch-page a.button,
.watch-page .like-btn,
.watch-page .action-btn {
  background: var(--search-menu-bg, #222) !important;
}

.mobile-category-toggle{
  display:none;
  width:40px;height:40px;
  flex:0 0 40px;
  padding:9px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  background:rgba(255,255,255,.10) !important;
  color:#fff;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(14px) saturate(135%);
  -webkit-backdrop-filter:blur(14px) saturate(135%);
}
.mobile-category-toggle span{
  display:block;height:2px;margin:4px 0;border-radius:2px;background:#fff;
}

@media(max-width:600px){
  .header-inner{
    display:grid;
    grid-template-columns:40px 1fr 40px;
    grid-template-rows:40px auto;
    align-items:center;
    gap:8px 10px;
    padding:10px 12px;
  }
  .mobile-category-toggle{display:block;grid-column:1;grid-row:1;}
  .logo{
    grid-column:2;grid-row:1;
    justify-content:center;
    padding:0 !important;
    min-width:0;
    font-size:18px;
  }
  .logo img{width:32px;height:32px;}
  .account{
    position:static;
    grid-column:3;grid-row:1;
    justify-self:end;
  }
  .account .avatar{width:38px;height:38px;}
  .search{
    grid-column:1 / -1;grid-row:2;
    width:100%;
  }
  .search input{width:100%;}

  .category-sidebar{
    display:none;
    left:8px;right:8px;top:74px;width:auto;
    max-height:calc(100vh - 90px);
    padding:9px;
    flex-direction:column;
    align-items:stretch;
    gap:5px;
    overflow-y:auto;
    overflow-x:hidden;
    border-radius:16px;
    z-index:7000;
  }
  .category-sidebar.mobile-open{display:flex;}
  .category-title{display:block;}
  .category-btn{width:100%;margin:0;padding:11px 12px;font-size:13px;}
  main{margin-left:0;padding-top:92px;}
  body{padding-top:136px;}
}

</style>
</head>

<body>

<header>
<div class="header-inner">

<button class="mobile-category-toggle" id="mobileCategoryToggle" type="button" aria-label="Открыть меню разделов" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<a href="index.html" class="logo">
<img src="logo.png" alt="ViceTube">
<span>ViceTube</span>
</a>

<div class="search">
<input
type="text"
id="searchInput"
placeholder="Поиск"
autocomplete="off">
</div>

<div class="account">

<div
class="avatar"
id="avatarButton"
role="button"
tabindex="0"
aria-label="Профиль"
title="Профиль">
<img id="headerAvatar" src="logo.png" alt="Профиль">
</div>

<div class="menu" id="menu">
<div id="accountContent"></div>
</div>

</div>
</div>
</header>

<nav class="category-sidebar" aria-label="Категории видео">
  <div class="category-title">Разделы</div>
  <button class="category-btn active" data-category="all">Все</button>
  <button class="category-btn" data-category="развлекательное">Развлекательное</button>
  <button class="category-btn" data-category="познавательное">Познавательное</button>
  <button class="category-btn" data-category="обзоры">Обзоры</button>
  <button class="category-btn" data-category="игры">Игры</button>

  <section class="subscriptions-section" aria-label="Подписки">
    <div class="subscriptions-title">Подписки</div>
    <div class="subscriptions-list" id="subscriptionsList">
      <div class="subscriptions-empty">Загрузка...</div>
    </div>
  </section>
</nav>

<footer class="site-footer" aria-label="Нижнее меню">
  <div class="site-footer-links">
    <a href="README.md">О проекте</a>
    <a href="пожелания.txt">Пожелания</a>
  </div>
  <div class="site-footer-copy">© 2026 ViceTube</div>
</footer>

<main>

<h1>Рекомендации</h1>

<div
  class="video-grid"
  id="videoGrid">
</div>

</main>

<script>

const menu = document.getElementById("menu");
const accountContent = document.getElementById("accountContent");

function updateAccountMenu(){

const account = localStorage.getItem("account");
const headerAvatar = document.getElementById("headerAvatar");

if(headerAvatar){
    try{
        const data = account ? JSON.parse(account) : null;
        headerAvatar.src = data && data.avatar ? data.avatar : "Guest.jpg";
        headerAvatar.alt = data && (data.username || data.name)
            ? "Аватар " + (data.username || data.name)
            : "Профиль";
    }catch(e){
        headerAvatar.src = "Guest.jpg";
        headerAvatar.alt = "Профиль";
    }
}

if(account){

let data;

try{
    data = JSON.parse(account);}
catch{
    data = {
    username:""};}

const name = data.username || data.name || data.login || "Пользователь";

accountContent.innerHTML = `
<div class="account-name">
${escapeHTML(name)}
</div>

<a href="account.html">👤 Личный кабинет</a>

<a href="upload.html">Загрузить видео</a>

<a href="history.html">История</a>

<button onclick="logout()">Выйти</button>`;

}else{

accountContent.innerHTML = `
<a href="login.html">👤 Войти в аккаунт</a>`;}}

function toggleMenu(){

 updateAccountMenu();

 if(menu.classList.contains("show")){
 menu.classList.remove("show");}
 else
 {menu.classList.add("show");}}

 avatarButton.addEventListener("click",function(event){

 event.stopPropagation();

 toggleMenu();});

 avatarButton.addEventListener("keydown",function(event){

 if(event.key === "Enter" || event.key === " "){

 event.preventDefault();

 toggleMenu();}});

 document.addEventListener("click",function(event){

 if(!event.target.closest(".account")){
 menu.classList.remove("show");}});

function logout(){

    localStorage.removeItem("account");

    menu.classList.remove("show");

    updateAccountMenu();
}

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

updateAccountMenu();

const searchInput =
    document.getElementById("searchInput");

 searchInput.addEventListener("keydown",function(event){

    if(event.key !== "Enter") return;

    const query =
        searchInput.value.trim();

    if(!query) return;

    localStorage.setItem(
        "lastSearch",
        query
    );

    window.location.href =
        "index.html?search=" +
        encodeURIComponent(query);
});

(function(){

    const header =
        document.querySelector("header");

    if(!header) return;

    let lastY = window.scrollY;
    let ticking = false;

    function update(){

        const y = window.scrollY;
        const delta = y - lastY;

        header.classList.toggle(
            "vt-glass-scrolled",
            y > 8
        );

        if(
            Math.abs(delta) > 2 &&
            y > 50
        ){

            header.classList.toggle(
                "vt-glass-moving",
                delta > 0
            );

        }else if(y <= 50){

            header.classList.remove(
                "vt-glass-moving"
            );
        }

        lastY = y;
        ticking = false;
    }

    window.addEventListener(
        "scroll",
        function(){

            if(!ticking){

                requestAnimationFrame(update);

                ticking = true;
            }

        },
        {
            passive:true
        }
    );

    update();

})();

function getThumbCache(){
    try{
        return JSON.parse(localStorage.getItem("videoThumbnails")) || {};
    }catch(e){
        return {};
    }
}

function saveThumb(file,data){
    try{
        const cache=getThumbCache();
        cache[file]=data;
        localStorage.setItem("videoThumbnails",JSON.stringify(cache));
    }catch(e){}
}

function safeVideoUrl(file){
    return encodeURI(String(file || ""));
}

function makeFallback(){
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">' +
        '<rect width="100%" height="100%" fill="#222"/>' +
        '<text x="50%" y="50%" fill="#888" font-family="Arial" font-size="24" ' +
        'text-anchor="middle" dominant-baseline="middle">Нет превью</text></svg>'
    );
}

function generateThumbnail(video,img){
    const file=video.file;
    const cache=getThumbCache();

    if(cache[file]){
        img.src=cache[file];
        return;
    }

    if(video.thumbnail){
        img.src=safeVideoUrl(video.thumbnail);
        return;
    }

    if(video.poster){
        img.src=safeVideoUrl(video.poster);
        return;
    }

    if(!file){
        img.src=makeFallback();
        return;
    }

    const probe=document.createElement("video");
    probe.preload="metadata";
    probe.muted=true;
    probe.playsInline=true;
    probe.src=safeVideoUrl(file);

    let finished=false;
    const cleanup=()=>{
        probe.removeAttribute("src");
        probe.load();
        probe.remove();
    };

    const fail=()=>{
        if(finished)return;
        finished=true;
        img.src=makeFallback();
        cleanup();
    };

    const capture=()=>{
        if(finished)return;
        if(!probe.videoWidth || !probe.videoHeight){
            fail();
            return;
        }

        const canvas=document.createElement("canvas");
        const width=640;
        canvas.width=width;
        canvas.height=Math.max(1,Math.round(width*probe.videoHeight/probe.videoWidth));

        try{
            const ctx=canvas.getContext("2d");
            ctx.drawImage(probe,0,0,canvas.width,canvas.height);
            const data=canvas.toDataURL("image/jpeg",0.0);
            finished=true;
            img.src=data;
            saveThumb(file,data);
            cleanup();
        }catch(e){
            fail();
        }
    };

    probe.addEventListener("loadedmetadata",()=>{
        const t=Number.isFinite(probe.duration)
            ? Math.min(Math.max(probe.duration*0.05,0),1)
            : 0;
        try{
            probe.currentTime=t;
            if(t===0)capture();
        }catch(e){
            capture();
        }
    },{once:true});

    probe.addEventListener("seeked",capture,{once:true});
    probe.addEventListener("error",fail,{once:true});
}

async function loadVideos(){
    const grid=document.getElementById("videoGrid");

    try{
        const response=await fetch("videos.json");
        if(!response.ok)throw new Error("Ошибка загрузки videos.json");

        const jsonVideos=await response.json();
        let uploadedVideos=[];
        try{
            uploadedVideos=JSON.parse(localStorage.getItem("uploadedVideos")) || [];
            if(!Array.isArray(uploadedVideos))uploadedVideos=[];
        }catch(e){
            uploadedVideos=[];
        }

        renderVideos([...jsonVideos,...uploadedVideos]);
    }catch(error){
        console.error(error);
        grid.innerHTML=`<p style="color:#aaa">Не удалось загрузить видео.</p>`;
    }
}

function getViews(){
    try{
        const views=JSON.parse(localStorage.getItem("videoViews")) || {};
        return views && typeof views==="object" ? views : {};
    }catch(e){
        return {};
    }
}

function formatViews(value){
    const n=Math.max(0,Number(value)||0);
    return new Intl.NumberFormat("ru-RU").format(n);
}

function renderVideos(videos){
    const grid=document.getElementById("videoGrid");
    const params=new URLSearchParams(window.location.search);
    const search=(params.get("search") || "").toLowerCase().trim();
    const category=window.ViceTubeCategory || "all";

    let filtered=videos;
    if(search){
        filtered=filtered.filter(video=>{
            const title=String(video.title || "").toLowerCase();
            const description=String(video.description || "").toLowerCase();
            const tags=Array.isArray(video.hashtags) ? video.hashtags.join(" ").toLowerCase() : String(video.hashtags || "").toLowerCase();
            return title.includes(search) || description.includes(search) || tags.includes(search);
        });
    }
    if(category !== "all") {
        filtered=filtered.filter(video=>{
            const tags=Array.isArray(video.hashtags) ? video.hashtags : [];
            return tags.some(tag=>String(tag).replace(/^#/,'').toLowerCase()===category);
        });
    }

    if(!filtered.length){
        grid.innerHTML=`<p style="color:#aaa">Видео не найдены.</p>`;
        return;
    }

    grid.innerHTML="";

    filtered.forEach(video=>{
        const card=document.createElement("div");
        card.className="video-card";
        card.tabIndex=0;
        card.addEventListener("click",()=>openVideo(video.id));
        card.addEventListener("keydown",e=>{
            if(e.key==="Enter" || e.key===" "){
                e.preventDefault();
                openVideo(video.id);
            }
        });

        const img=document.createElement("img");
        img.className="thumbnail";
        img.alt=video.title || "Видео";
        img.loading="lazy";
        img.src=video.thumbnail || video.poster || makeFallback();
        img.onerror=()=>{
            img.onerror=null;
            img.src=makeFallback();
        };

        const info=document.createElement("div");
        info.className="video-info";

        const title=document.createElement("div");
        title.className="video-title";
        title.textContent=video.title || "Без названия";

        const meta=document.createElement("div");
        meta.className="video-meta";
        meta.textContent=formatViews(getViews()[video.id] || 0) + " просмотров";

        const channel=document.createElement("a");
        channel.className="video-channel";
        channel.href="channel.html?id="+encodeURIComponent(video.channelId || "default");
        channel.textContent=video.channelName || "ViceTube";
        channel.addEventListener("click",e=>e.stopPropagation());

        info.append(title,channel,meta);
        card.append(img,info);
        grid.appendChild(card);

        if(!video.thumbnail && !video.poster){
            generateThumbnail(video,img);
        }
    });
}

function openVideo(id){
    if(id===undefined || id===null || id==="")return;
    window.location.href="watch.html?id="+encodeURIComponent(id);
}

window.ViceTubeCategory="all";

async function loadSubscriptions(){
  const list=document.getElementById("subscriptionsList");
  if(!list)return;

  let subscriptions=[];
  try{
    const stored=JSON.parse(localStorage.getItem("subscriptions") || "[]");
    subscriptions=Array.isArray(stored) ? stored.map(String) : [];
  }catch(e){
    subscriptions=[];
  }

  if(!subscriptions.length){
    list.innerHTML='<div class="subscriptions-empty">Нет подписок</div>';
    return;
  }

  try{
    const response=await fetch("channels.json");
    if(!response.ok)throw new Error("Ошибка загрузки channels.json");
    const channels=await response.json();
    const channelMap=new Map((Array.isArray(channels)?channels:[]).map(channel=>[String(channel.id),channel]));

    // Канал самого пользователя может существовать только в account, а не в channels.json.
    try{
      const account=JSON.parse(localStorage.getItem("account") || "null");
      if(account && account.channelId){
        const channelId=String(account.channelId);
        if(!channelMap.has(channelId)){
          channelMap.set(channelId,{
            id:account.channelId,
            name:account.channelName || account.username || "Мой канал",
            avatar:account.avatar || "Guest.jpg"
          });
        }
      }
    }catch(e){}

    list.innerHTML="";
    let rendered=0;

    subscriptions.forEach(id=>{
      const channel=channelMap.get(id);
      if(!channel)return;

      const link=document.createElement("a");
      link.className="subscription-channel";
      link.href="channel.html?id="+encodeURIComponent(channel.id);
      link.title=channel.name || "Канал";

      const avatar=document.createElement("img");
      avatar.src=channel.avatar || "Guest.jpg";
      avatar.alt="";
      avatar.loading="lazy";
      avatar.onerror=()=>{avatar.onerror=null;avatar.src="Guest.jpg";};

      const name=document.createElement("span");
      name.textContent=channel.name || "Канал";

      link.append(avatar,name);
      list.appendChild(link);
      rendered++;
    });

    if(!rendered){
      list.innerHTML='<div class="subscriptions-empty">Нет подписок</div>';
    }
  }catch(error){
    console.error(error);
    list.innerHTML='<div class="subscriptions-empty">Не удалось загрузить подписки</div>';
  }
}

const mobileCategoryToggle=document.getElementById("mobileCategoryToggle");
const categorySidebar=document.querySelector(".category-sidebar");
if(mobileCategoryToggle && categorySidebar){
  mobileCategoryToggle.addEventListener("click",(event)=>{
    event.stopPropagation();
    const opened=categorySidebar.classList.toggle("mobile-open");
    mobileCategoryToggle.setAttribute("aria-expanded",opened?"true":"false");
  });
  document.addEventListener("click",(event)=>{
    if(window.innerWidth<=600 && categorySidebar.classList.contains("mobile-open") &&
       !categorySidebar.contains(event.target) && event.target!==mobileCategoryToggle){
      categorySidebar.classList.remove("mobile-open");
      mobileCategoryToggle.setAttribute("aria-expanded","false");
    }
  });
}

document.querySelectorAll(".category-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    window.ViceTubeCategory=btn.dataset.category || "all";
    loadVideos();
    if(categorySidebar && window.innerWidth<=600){
      categorySidebar.classList.remove("mobile-open");
      if(mobileCategoryToggle) mobileCategoryToggle.setAttribute("aria-expanded","false");
    }
  });
});

loadVideos();
loadSubscriptions();

window.addEventListener("storage",event=>{
  if(event.key==="subscriptions" || event.key==="account") loadSubscriptions();
});

</script>
