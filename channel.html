<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Канал — ViceTube</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0f0f0f;
color:#fff;
font-family:Arial,Helvetica,sans-serif}

header{
position:sticky;
top:12px;margin:0 2vw;
z-index:10;
background:rgba(32,32,32,.72);
backdrop-filter:blur(20px);
border:1px solid #ffffff20;
border-radius:18px;
box-shadow:0 12px 35px #0006}

.head{
height:64px;
display:flex;
align-items:center;
justify-content:center;
position:relative}

.logo{
display:flex;
align-items:center;
gap:9px;
color:#b000ff;
text-decoration:none;
font-weight:700;font-size:21px}

.logo img{
width:36px;
height:36px;
border-radius:9px}

.back{
position:absolute;
left:14px;color:#fff;
text-decoration:none;
padding:9px 13px;
border-radius:9px;
background:#ffffff10}

.channel{
max-width:1200px;
margin:30px auto;
padding:0 18px 50px}

.hero{
height:220px;
border-radius:20px;
background:#fff;
border:1px solid #ffffff14;
background-size:cover;
background-position:center}

.identity{
display:flex;
gap:18px;
align-items:center;
margin-top:-55px;
padding:0 28px;
position:relative}

.avatar{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:4px solid #111;
background:#222}

.name{
margin-top:50px;
font-size:30px;
font-weight:700}

.desc{
color:#aaa;
margin-top:2%;
max-width:700px}

.subscribe{
margin-left:auto;
border:0;
border-radius:22px;
padding:11px 18px;
background:#a600ff;
color:#fff;
font-weight:700;
cursor:pointer}

.subcount{
color:#999;
font-size:13px;
margin-top:5px}

.videos{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
gap:18px;
margin-top:35px}

.card{
background:#181818;
border-radius:12px;
overflow:hidden;
cursor:pointer}

.thumb{
width:100%;
aspect-ratio:16/9;
object-fit:cover;
display:block;
background:#000}

.info{
padding:12px}

.title{
font-weight:700;
line-height:1.3}

.meta{
color:#999;
font-size:13px;
margin-top:7px}

@media(max-width:650px){
    
.identity{
align-items:flex-start;
flex-wrap:wrap;padding:0 10px}

.avatar{
width:82px;
height:82px}

.name{
margin-top:-3%;
font-size:24px}

.subscribe{
margin-left:0}

.hero{
height:170px}

.videos{
grid-template-columns:1fr 1fr;
gap:12px}

.channel{
padding:0 12px}

.back{
font-size:13px}

.logo{
font-size:18px}}

@media(max-width:430px){
    
.videos{
grid-template-columns:1fr}

.identity{
margin-top:-42px}}
</style>
</head>
<body>
<header>
<div class="head">
<a class="back" href="index.html">←Главная</a>
</div></header>
<main class="channel">
<div class="hero" id="hero">
</div><section class="identity">
<img class="avatar" id="avatar" src="Guest.jpg">
<div>
<div class="name" id="name">Канал</div>
<div class="subcount" id="subcount">0 подписчиков</div>
<div class="desc" id="desc"></div>
</div>
<button class="subscribe" id="subscribe">Подписаться</button>
</section>
<div class="videos" id="videos"></div>
</main>
<script>
const id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const views=()=>{try{return JSON.parse(localStorage.getItem('videoViews'))||{}}catch(e){return{}}};
Promise.all([fetch('channels.json').then(r=>r.json()),fetch('videos.json').then(r=>r.json()),Promise.resolve(JSON.parse(localStorage.getItem('uploadedVideos')||'[]'))]).then(([channels,base,uploaded])=>{
 const account=(()=>{try{return JSON.parse(localStorage.getItem('account'))}catch(e){return null}})();
 const all=[...base,...uploaded];
 let ch=channels.find(c=>String(c.id)===String(id));
 if(!ch && account && String(account.channelId)===String(id)) ch={id:account.channelId,name:account.channelName||account.username,description:account.bio||'',avatar:account.avatar||'Guest.jpg',banner:account.banner||''};
 if(!ch){document.getElementById('name').textContent='Канал не найден';return}
 document.title=ch.name+' — ViceTube'; document.getElementById('name').textContent=ch.name; document.getElementById('desc').textContent=ch.description||''; document.getElementById('avatar').src=ch.avatar||'Guest.jpg'; if(ch.banner)document.getElementById('hero').style.backgroundImage=`url("${ch.banner}")`;
 const subKey='subscriptions'; let subs=[];try{subs=JSON.parse(localStorage.getItem(subKey))||[]}catch(e){}
 const subscribed=subs.includes(ch.id); const btn=document.getElementById('subscribe'); btn.textContent=subscribed?'Вы подписаны':'Подписаться'; document.getElementById('subcount').textContent=(Number(ch.subscribers)||0)+subs.filter(x=>x===ch.id).length+' подписчиков';
 btn.onclick=()=>{let a=[];try{a=JSON.parse(localStorage.getItem(subKey))||[]}catch(e){};const i=a.indexOf(ch.id);if(i>=0)a.splice(i,1);else a.push(ch.id);localStorage.setItem(subKey,JSON.stringify(a));location.reload()};
 const mine=all.filter(v=>String(v.channelId||'')===String(ch.id)); const grid=document.getElementById('videos'); if(!mine.length){grid.innerHTML='<p style="color:#999">На канале пока нет видео.</p>';return}
 const thumbCache=()=>{try{return JSON.parse(localStorage.getItem('videoThumbnails'))||{}}catch(e){return {}}};
 const saveThumb=(file,data)=>{try{const c=thumbCache();c[file]=data;localStorage.setItem('videoThumbnails',JSON.stringify(c))}catch(e){}};
 const fallback=()=> 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#222"/><text x="50%" y="50%" fill="#888" font-family="Arial" font-size="24" text-anchor="middle" dominant-baseline="middle">Нет превью</text></svg>');
 const generateThumbnail=(video,img)=>{
   const file=video.file, cache=thumbCache();
   if(cache[file]){img.src=cache[file];return;}
   if(video.thumbnail){img.src=encodeURI(String(video.thumbnail));return;}
   if(video.poster){img.src=encodeURI(String(video.poster));return;}
   if(!file){img.src=fallback();return;}
   const probe=document.createElement('video'); probe.preload='metadata'; probe.muted=true; probe.playsInline=true; probe.src=encodeURI(String(file));
   let done=false; const cleanup=()=>{probe.removeAttribute('src');probe.load();probe.remove()};
   const fail=()=>{if(done)return;done=true;img.src=fallback();cleanup()};
   const capture=()=>{if(done)return;if(!probe.videoWidth||!probe.videoHeight){fail();return} const canvas=document.createElement('canvas');canvas.width=640;canvas.height=Math.max(1,Math.round(640*probe.videoHeight/probe.videoWidth));try{canvas.getContext('2d').drawImage(probe,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.82);done=true;img.src=data;saveThumb(file,data);cleanup()}catch(e){fail()}};
   probe.addEventListener('loadedmetadata',()=>{const t=Number.isFinite(probe.duration)?Math.min(Math.max(probe.duration*.05,0),1):0;try{probe.currentTime=t;if(t===0)capture()}catch(e){capture()}},{once:true});
   probe.addEventListener('seeked',capture,{once:true}); probe.addEventListener('error',fail,{once:true});
 };
 mine.forEach(v=>{const card=document.createElement('article');card.className='card';card.onclick=()=>location.href='watch.html?id='+encodeURIComponent(v.id);const img=document.createElement('img');img.className='thumb';img.alt=v.title||'Видео';img.loading='lazy';img.src=v.thumbnail||v.poster||fallback();img.onerror=()=>{img.onerror=null;img.src=fallback()};const info=document.createElement('div');info.className='info';info.innerHTML='<div class="title">'+esc(v.title||'Без названия')+'</div><div class="meta">'+new Intl.NumberFormat('ru-RU').format(Number(views()[v.id])||0)+' просмотров</div>';card.append(img,info);grid.append(card);if(!v.thumbnail&&!v.poster)generateThumbnail(v,img)})
}).catch(e=>{document.getElementById('name').textContent='Не удалось загрузить канал'});
</script><script src="site-profile.js"></script></body></html>
